name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test --testTimeout=20000 # sim-heavy tests take ~2s locally and 2–3× that on the runner
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps
      - run: pnpm test:replay
